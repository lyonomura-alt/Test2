<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2画像編集">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>2画像編集</title>
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101216;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
    #stage{display:block;width:100%;height:100%;background:#25282d;touch-action:none}
    .top{position:fixed;z-index:3;top:max(12px,env(safe-area-inset-top));left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none}
    .group{display:flex;gap:7px;pointer-events:auto}.pill,.round,.small{border:1px solid #68707a;background:#1b1f25dd;color:#fff;box-shadow:0 2px 9px #0008;min-height:38px;font-size:14px}.pill{border-radius:19px;padding:0 13px}.round{width:38px;border-radius:50%;font-size:21px;line-height:34px}.small{border-radius:9px;padding:8px 10px}.active{background:#efc900!important;color:#171717!important;border-color:#ffe66c!important}.danger{color:#ffb0b0}
    #panel{position:fixed;z-index:4;left:0;right:0;bottom:0;transform:translateY(105%);transition:transform .22s ease;background:#171b21f5;border-top:1px solid #59616b;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:58vh;overflow:auto}.panel-open{transform:translateY(0)!important}
    .row{display:grid;grid-template-columns:64px 1fr 48px;align-items:center;gap:9px;margin:10px 0}.row output{text-align:right;font-variant-numeric:tabular-nums;color:#f7db3a}.row input{width:100%} label.check{display:flex;align-items:center;gap:8px;margin:10px 0}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.hint{position:fixed;z-index:2;left:50%;bottom:18px;transform:translateX(-50%);background:#111c;border-radius:18px;padding:7px 12px;font-size:12px;pointer-events:none;transition:opacity .5s}.hidden{opacity:0;pointer-events:none}
    #picker{display:none}
  </style>
</head>
<body>
  <canvas id="stage" aria-label="画像編集領域"></canvas>
  <div class="top">
    <div class="group"><button class="pill" data-layer="0">画像1</button><button class="pill" data-layer="1">画像2</button></div>
    <div class="group"><button class="round" id="add" title="画像を追加・入替">＋</button><button class="round" id="adjust" title="調整">☷</button><button class="round" id="cut" title="カットモード">✂</button><button class="round" id="undoCut" title="カットを戻す">↶</button><button class="round" id="save" title="PNG保存">⇩</button></div>
  </div>
  <input id="picker" type="file" accept="image/*">
  <div id="panel">
    <div class="row"><span>縮尺</span><input id="scale" type="range" min="10" max="300" value="100"><output id="scaleOut">100%</output></div>
    <div class="row"><span>回転</span><input id="rotation" type="range" min="-180" max="180" value="0"><output id="rotationOut">0°</output></div>
    <div class="row"><span>透明度</span><input id="opacity" type="range" min="0" max="100" value="100"><output id="opacityOut">100%</output></div>
    <label class="check"><input id="lockScale" type="checkbox"> 縮尺固定（ピンチ操作のみ）</label>
    <label class="check"><input id="lockRotation" type="checkbox"> 回転固定（2本指ひねり操作のみ）</label>
    <div class="tools"><button class="small" id="boundary">境界線モード</button><button class="small" id="boundaryUndo">境界線を戻す</button><button class="small danger" id="boundaryDelete">境界線を削除</button><button class="small" id="segment">区間: 曲線</button></div>
  </div>
  <div class="hint" id="hint">画像をタップして選択</div>
  <script src="renderer.js"></script><script src="editor.js"></script>
</body>
</html>
