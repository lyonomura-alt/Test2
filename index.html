<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#101216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="2画像編集">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <title>2画像編集</title>
  <style>
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#101216; color:#fff; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    body { touch-action:none; overscroll-behavior:none; }
    #stage { position:fixed; inset:0; display:block; width:100%; height:100%; background:#25282d; touch-action:none; }
    .top { position:fixed; z-index:10; top:max(12px,env(safe-area-inset-top)); left:12px; right:12px; display:flex; justify-content:space-between; gap:8px; pointer-events:none; }
    .group { display:flex; gap:6px; pointer-events:auto; }
    button { appearance:none; -webkit-appearance:none; border:1px solid #68707a; background:#1b1f25eF; color:#fff; box-shadow:0 2px 9px #0008; font:inherit; cursor:pointer; }
    .pill { min-height:38px; border-radius:20px; padding:0 12px; font-size:14px; }
    .round { width:38px; height:38px; border-radius:50%; font-size:20px; line-height:34px; padding:0; }
    .small { border-radius:9px; padding:8px 10px; font-size:14px; }
    .active { background:#efc900!important; color:#171717!important; border-color:#ffe66c!important; }
    .danger { color:#ffb0b0; }
    #panel { position:fixed; z-index:11; left:0; right:0; bottom:0; transform:translateY(105%); transition:transform .22s ease; background:#171b21fa; border-top:1px solid #59616b; padding:14px 16px calc(14px + env(safe-area-inset-bottom)); max-height:58vh; overflow:auto; }
    #panel.panel-open { transform:translateY(0); }
    .row { display:grid; grid-template-columns:64px 1fr 52px; align-items:center; gap:9px; margin:10px 0; }
    .row output { text-align:right; color:#f7db3a; font-variant-numeric:tabular-nums; }
    .row input { width:100%; }
    label.check { display:flex; align-items:center; gap:8px; margin:10px 0; }
    .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:13px; }
    #picker { display:none; }
    #hint { position:fixed; z-index:9; left:50%; bottom:18px; transform:translateX(-50%); background:#111d; border-radius:18px; padding:7px 12px; font-size:12px; white-space:nowrap; pointer-events:none; transition:opacity .4s; }
    #hint.hidden { opacity:0; }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="画像編集領域"></canvas>
  <nav class="top" aria-label="画像編集メニュー">
    <div class="group"><button class="pill" data-layer="0">画像1</button><button class="pill" data-layer="1">画像2</button></div>
    <div class="group"><button class="round" id="add" type="button" title="画像を追加・入替">＋</button><button class="round" id="adjust" type="button" title="調整">☷</button><button class="round" id="cut" type="button" title="カットモード">✂</button><button class="round" id="undoCut" type="button" title="カットを戻す">↶</button><button class="round" id="save" type="button" title="PNG保存">⇩</button></div>
  </nav>
  <input id="picker" type="file" accept="image/*">
  <section id="panel" aria-label="調整メニュー">
    <div class="row"><span>縮尺</span><input id="scale" type="range" min="10" max="300" value="100"><output id="scaleOut">100%</output></div>
    <div class="row"><span>回転</span><input id="rotation" type="range" min="-180" max="180" value="0"><output id="rotationOut">0°</output></div>
    <div class="row"><span>透明度</span><input id="opacity" type="range" min="0" max="100" value="100"><output id="opacityOut">100%</output></div>
    <label class="check"><input id="lockScale" type="checkbox">縮尺固定（ピンチ操作のみ）</label>
    <label class="check"><input id="lockRotation" type="checkbox">回転固定（2本指ひねり操作のみ）</label>
    <div class="tools"><button class="small" id="boundary" type="button">境界線モード</button><button class="small" id="boundaryUndo" type="button">境界線を戻す</button><button class="small danger" id="boundaryDelete" type="button">境界線を削除</button><button class="small" id="segment" type="button">区間: 曲線</button></div>
  </section>
  <div id="hint">＋を押して画像を追加</div>
  <script src="./renderer.js"></script>
  <script src="./editor.js"></script>
</body>
</html>
